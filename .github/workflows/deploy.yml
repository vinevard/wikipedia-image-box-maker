name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tools/test/ui.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # GitHub Pages lets browsers reuse a file for 10 minutes without a check. A new ?v= for each changed file
      # stops a new index.html from running with an old script.
      - name: Version the file URLs
        run: |
          mkdir _site
          cp index.html app.js style.css thumbnail.js favicon.svg apple-touch-icon.png social.jpg LICENSE _site/
          for file in style.css thumbnail.js app.js; do
            hash=$(sha256sum "$file" | cut -c1-10)
            sed -i "s/${file//./\\.}?v=[0-9a-z]*/$file?v=$hash/" _site/index.html
            grep -q "$file?v=$hash" _site/index.html
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
