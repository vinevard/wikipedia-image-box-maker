name: Wikipedia check

# Wikipedia changes its pages without notice. Once a week, this compares the tool with the live figures in
# tools/verify/cases.json and fails if one of them no longer matches.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    # The limits in compare.py were measured on Windows. Linux draws text differently enough to fail them.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip install pillow
      - run: python tools/verify/compare.py --check
      # The image pairs show what changed.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparison
          path: |
            tools/verify/out/*.png
            tools/verify/out/report.json
